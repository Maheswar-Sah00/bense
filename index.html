<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#181716" />
    <script>
      // Set the theme before first paint (see src/theme.ts). Dark unless the user chose otherwise.
      try {
        var t = localStorage.getItem('bense.theme')
        t = t === 'light' || t === 'system' ? t : 'dark'
      } catch (e) {
        t = 'dark'
      }
      document.documentElement.dataset.theme = t
      if (t === 'light' || (t === 'system' && !matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f7f6f3')
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..800&family=Inter:wght@400..800&display=swap" rel="stylesheet" />
    <meta name="description" content="See what a box dye will really do to your hair before you buy it." />
    <!-- ?v=2: the 本 logo icons; a new address makes browsers and phones drop the old cached icon. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="48x48" />
    <link rel="icon" href="/icon.svg?v=2" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Bense</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
