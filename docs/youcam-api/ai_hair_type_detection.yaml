openapi: 3.0.0
info:
  title: AI Hair Type Detection
  description: >
    # Overview

    Imagine having an AI hair expert in your pocket. Our tech dives into your
    hair's texture, thickness, and curl pattern, picking from ten unique curl
    shapes and sorting them into nine clear types, from Straight to Super Kinky.
    You get a full hair profile, and brands can use those insights to deliver
    spot-on product recommendations and tips just for you.


    ## Integration Guide

    * How to Take Photos for AI Hair Type Detection

    * Take 3 Photos from left, front facing to right.
      - Just snap three quick selfies. One facing straight ahead, one turning about 45 degrees to the left, and one turning 45 degrees to the right. We're trying to catch the full look of your hair from all sides. Make sure your whole face and the upper boundary of your hair are clearly visible in each photo. Your face should take up around 50% to 80% of the image width. Not too small, not too close. That way, it's sharp enough for analysis. When you turn for the side shots, rotate your head left and right like you're saying 'no' (that's called yaw rotation). Keep your head level with no tilting up, down, or sideways. Skip any back or top-down angles because those wont work for us.
      - You can utilize the JS Camera Kit to snap photos. Make sure your hair is not tied up and let it hang in front of your chest. Turn your head to the right and hold still, and turn to the left to get 3 images to be analyzed.

    * How to Detect Hair Type by AI

    * Using the ***/s2s/v2.0/file*** API, please upload the following assets:
      - Photos from the front, the right side, and the left side.

    * Execute AI task ***/s2s/v2.0/task/hair-type-detection*** </br>

    Run the hair-type detection task by sending in three images: one from the
    front, one from the right side, and one from the left side. Use their file
    IDs as the source inputs for the AI.


    * Polling to check the status of a task until it succeed or error</br>

    This ***task_id*** is used to monitor the task's status through polling GET
    'task/hair-type-detection' to retrieve the current engine status. Until the
    engine completes the task, the status will remain 'running', and no units
    will be consumed during this stage.


    ## Hair Type Classification

    |Category|Thumbnail|Hair Type Classification|Description|

    |  ----  | ----  | ----  | ----  |

    |1|![](https://d3ss46vukfdtpo.cloudfront.net/static/media/img_t1.b19d4657.jpg)|Straight|
    This hair type is characterized by strands that lack natural curls and
    typically fall straight from the root to the tip|

    |2A|![](https://d3ss46vukfdtpo.cloudfront.net/static/media/img_t2A.351ef0a6.jpg)|Slight
    Wavy| This hair type features subtle, delicate waves with a smooth and
    tousled texture, but lacks volume at the roots|

    |2B|![](https://d3ss46vukfdtpo.cloudfront.net/static/media/img_t2B.daac62f4.jpg)|Medium
    Wavy| This hair type that showcases natural S-shaped waves that typically
    begin in the middle of the hair shaft and delicately hug the head, creating
    a subtle and sophisticated dimension|

    |2C|![](https://d3ss46vukfdtpo.cloudfront.net/static/media/img_t2C.10ef2132.jpg)|Thick
    Wavy|The waves in this hair type are characterized by a coarse texture and
    are shaped like the letter "S", starting at the root and continuing down the
    length of the hair. This hair type is prone to frizz|

    |3A|![](https://d3ss46vukfdtpo.cloudfront.net/static/media/img_t3A.073b6767.jpg)|Loose
    Curls|These curls are big, relaxed, and bouncy, and have a noticeable sheen
    from roots to ends|

    |3B|![](https://d3ss46vukfdtpo.cloudfront.net/static/media/img_t3B.06bf109b.jpg)|Medium
    Curls|This hair type consists of coarse, springy ringlets that are prone to
    frizz|

    |3C|![](https://d3ss46vukfdtpo.cloudfront.net/static/media/img_t3C.9091ea1e.jpg)|Tight
    Curls|These curls boast a dense and compact corkscrew shape, lending them
    plenty of volume|

    |4A|![](https://d3ss46vukfdtpo.cloudfront.net/static/media/img_t4A.cf742771.jpg)|Kinky
    Soft|This hair type is characterized by tightly packed, springy S-shaped
    coils|

    |4B|![](https://d3ss46vukfdtpo.cloudfront.net/static/media/img_t4B.4a6300fe.jpg)|Coily|Densely
    packed coils tightly wound into sharp, zigzag angles|

    |4C|![](https://d3ss46vukfdtpo.cloudfront.net/static/media/img_t4C.4ed5a7f8.jpg)|Extremely
    Coily|This hair type is characterized by tight, fluffy coils that are more
    susceptible to breakage|


    * Result Arguments

    * mapping: result is a string showing the detected hair type category. Here
    lists all the possible result strings in an array:
      ```json
      ["1 to 2a", "2a to 2b", "2b to 2c", "2c to 3a", "3a to 3b", "3b to 3c", "3c to 4a", "4a to 4b", "4b to 4c"]
      ```
    * term: a one-to-one mapping string between hair type categories and their
    classifications. Here lists all the possible result strings in an array:
      ```json
      ["Straight to Slight Wavy", "Slight to Medium Wavy", "Medium to Thick Wavy", "Thick Wavy to Loose Curls", "Loose to Medium Curls", "Medium to Tight Curls", "Tight Curls to Kinky Soft", "Kinky Soft to Coily", "Coily to Extremely Coily"]
      ```

    * Suggestions for How to Shoot

    ![Suggestions for How to
    Shoot](https://bcw-media.s3.ap-northeast-1.amazonaws.com/strapi/assets/AI%20Hair%20Type%20Detection_how%20to%20shoot.png
    "Suggestions for How to Shoot")


    ![](https://bcw-media.s3.ap-northeast-1.amazonaws.com/strapi/assets/AI%20Skin%20Analysis_camera.png)


    ## File Specs & Errors

    * Supported Formats & Dimensions


    |Type|Supported Dimensions|Supported File Size|Supported Formats|

    |  ----  | ----  | ----  | ----  |

    |AI Hair Type Detection|The image must be at least 320 pixels wide and tall,
    and no more than 4096 pixels in either dimension. If one side of your image
    is longer than 1080 pixels, it will be resized automatically to fit within
    that limit for analysis.|< 10MB|jpg/png|


    * Error Codes


    |Error Code|Description|

    |  ----  | ----  |

    |error_mismatch_image_size|Make sure all your face photos (front, left, and
    right) are the same size|

    |error_below_min_image_size|If your image is smaller than 320 pixels in
    width or height, it's too small to use|

    |error_face_position_invalid|Your face needs to be fully visible in the
    image, without any parts cut off|

    |error_face_position_too_small|The face in your photo is too small to
    analyze properly|

    |error_face_position_out_of_boundary|Your face is either too large or
    partially outside the edges of the photo|

    |error_insufficient_lighting|The lighting is too dim, which makes analysis
    difficult|

    |error_face_angle_invalid|Your face angle isn't quite right. For
    front-facing shots, keep your head within 10 degrees of straight. For
    side-facing shots, the angle should be more than 15 degrees|


    * Environment & Dependency


    | Sample Code Language / Tool | Recommended Runtime Versions |

    |---|---|

    | cURL | - bash >= 3.2</br>   - curl >= 7.58 (modern TLS/HTTP
    support)</br>   - jq >= 1.6 (robust JSON parsing) |

    | Node.js (JavaScript) | Node >= 18 (for global fetch) |

    | JavaScript | - Chrome / Edge >= 80</br>   - Firefox >= 74</br>   - Safari
    >= 13.1 |

    | PHP | PHP >= 7.4 (for modern TLS/compat), ext-curl (recommended) or
    allow_url_fopen=On + ext-openssl, ext-json |

    | Python | Python >= 3.10 (for f-strings), requests >= 2.20.0 |

    | Java | Java 11+ (for HttpClient), Jackson Databind >= 2.12.0 |


