    ---
  version: ''
  termsOfService: https://www.makeupar.com/perfectbeauty/youcam/terms-of-service-api
  contact:
    email: YouCamOnlineEditor_API@perfectcorp.com
  license:
    name: Privacy policy
    url: https://www.makeupar.com/perfectbeauty/youcam/privacy-policy-api
servers:
  - url: https://yce-api-01.makeupar.com
paths:
  /s2s/v2.0/task/skin-tone-analysis:
    post:
      summary: Run an Skin Tone Analysis task.
      description: >
        This endpoint initiates the skin tone analysis process. You must provide
        a source file (via URL or File ID) and optionally specify face angle
        strictness level. The task will be processed asynchronously, and you can
        check its status using the task_id returned in this response.
      tags:
        - V1.0
      security:
        - BearerAuthenticationV2: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunSkinToneAnalysisTaskV2'
      responses:
        '200':
          description: Successful execution of the task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicRunTaskResponseV2'
        '400':
          description: Failed execution of task
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RunError'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /s2s/v2.0/task/skin-tone-analysis/{task_id}:
    get:
      summary: Check an Skin Tone Analysis task status.
      tags:
        - V1.0
      security:
        - BearerAuthenticationV2: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            example: grH0CvsgXuAIHLUzD0V1Ol34hoet3R1tvdbtiVHrDb6_UqCLKIejAIajwxrhOAfe
          description: ID of task to check
      responses:
        '200':
          description: Successful check of the task status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkinToneAnalysisTaskStatusResponseV2'
        '400':
          $ref: '#/components/responses/InvalidTaskId'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '500':
          $ref: '#/components/responses/TaskTimeout'
components:
  securitySchemes:
    BearerAuthenticationV2:
      type: http
      scheme: bearer
      description: >-
        Use the standard 'Bearer authentication'. Put your 'API Key' in header:
        `Authorization:Bearer YOUR_API_KEY`. Notice that there is ' ' a space
        between 'Bearer' and the 'YOUR_API_KEY'.
  schemas:
    RunSkinToneAnalysisTaskV2:
      title: Run Skin Tone Analysis Task V2
      allOf:
        - $ref: '#/components/schemas/BasicRunTaskV2'
        - type: object
          properties:
            face_angle_strictness_level:
              $ref: '#/components/schemas/BasicFaceAttrReqFaceAngleStrictnessLevel'
    BasicFaceAttrReqFaceAngleStrictnessLevel:
      type: string
      description: |
        The strictness level of face angle detection (pitch, yaw, roll).
        A stricter level ensures more accurate face attribute results.
        Default is 'high'.
        optoins:
          - strict: pitch <= 4 degrees, yaw <= 6 degrees, roll <= 4 degrees
          - high: pitch, yaw, roll <= 10 degrees
          - medium: pitch, yaw, roll <= 15 degrees
          - low: pitch, yaw, roll <= 20 degrees
          - flexible: pitch, yaw, roll <= 30 degrees
      enum:
        - strict
        - high
        - medium
        - low
        - flexible
      example: high
    BasicFaceAttrRespFaceQuality:
      type: object
      properties:
        has_face:
          type: boolean
          example: true
        area:
          type: string
          example: good
        frontal:
          type: string
          example: good
        lighting:
          type: string
          example: good
        faceangle:
          type: string
          example: good
    BasicFaceAttrRespColor:
      type: object
      properties:
        eye_color:
          type: string
          description: hex value of eye color
          example: '#293F9B'
        eye_color_name:
          type: string
          enum:
            - Amber
            - Brown
            - Green
            - Blue
            - Gray
            - Other
          example: Blue
        lip_color:
          type: string
          description: hex value of lip color
          example: '#D23245'
        eyebrow_color:
          type: string
          description: hex value of eyebrow color
          example: '#5B2B31'
        skin_color:
          type: string
          pattern: ^#([A-Fa-f0-9]{6})$
          description: Hex color code
          example: '#b9947c'
        hair_color:
          type: string
          format: color
          enum:
            - '#a0a0a0'
            - '#722626'
            - '#000000'
            - '#FAF0BE'
            - '#42280E'
            - '#808080'
            - '#B56637'
        hair_color_name:
          type: string
          enum:
            - Auburn
            - Black
            - Blonde
            - Brown
            - Grey/White
            - Red
    SkinToneAnalysisTaskStatusResponseV2:
      type: object
      properties:
        status:
          type: integer
          description: Response status
          example: 200
        data:
          type: object
          properties:
            task_status:
              type: string
              enum:
                - running
                - success
                - error
              description: Status of this task
            error:
              $ref: '#/components/schemas/EngineErrorCode'
            error_message:
              type: string
              description: Detailed description of error
            results:
              allOf:
                - type: object
                  properties:
                    face_quality:
                      $ref: '#/components/schemas/BasicFaceAttrRespFaceQuality'
                    color:
                      $ref: '#/components/schemas/BasicFaceAttrRespColor'
    BasicRunTaskV2SrcFileUrl:
      type: object
      required:
        - src_file_url
      properties:
        src_file_url:
          type: string
          description: Url of the file to run task. The url should be publicly accessible.
          example: https://example.com/selfie.jpg
    BasicRunTaskV2SrcFileId:
      type: object
      required:
        - src_file_id
      properties:
        src_file_id:
          type: string
          description: ID of file to run task. File ID from upload file API.
          example: pfNK5PuRe0MrwLHcGA3DOmB1ahwfXTbYHjv+KoBIxbE=
    BasicRunTaskV2:
      title: BasicRunTaskV2
      anyOf:
        - title: Run task with src file url
          allOf:
            - $ref: '#/components/schemas/BasicRunTaskV2SrcFileUrl'
        - title: Run task with src file ID
          allOf:
            - $ref: '#/components/schemas/BasicRunTaskV2SrcFileId'
    BasicRunTaskResponseV2:
      type: object
      properties:
        status:
          type: integer
          description: Response status
          example: 200
        data:
          type: object
          properties:
            task_id:
              type: string
              description: >-
                ID of this task. Task result is valid to query by this ID for 24
                hours.
              example: grH0CvsgXuAIHLUzD0V1Ol34hoet3R1tvdbtiVHrDb6_UqCLKIejAIajwxrhOAfe
    RunError:
      type: object
      properties:
        status:
          type: integer
          description: Response status
          example: 400
        error:
          type: string
          description: Error message
          example: The operation could not be completed
        error_code:
          type: string
          enum:
            - InvalidParameters
            - CreditInsufficiency
            - InvalidStyleGroup
            - InvalidStyle
            - BadRequest
          description: |
            Error code:
              * InvalidParameters - Invalid request parameters
              * CreditInsufficiency - Insufficient unit to run
              * BadRequest - Unexpected request parameter
              * InvalidStyleGroup - Invalid style group id
              * InvalidStyle - Invalid style id
    EngineErrorCode:
      type: string
      nullable: true
      enum:
        - error_exceed_max_image_size
        - exceed_max_filesize
        - invalid_parameter
        - error_download_image
        - error_download_mask
        - error_decode_image
        - error_decode_mask
        - error_nsfw_content_detected
        - error_no_face
        - error_pose
        - error_face_parsing
        - error_inference
        - exceed_nsfw_retry_limits
        - error_upload
        - unknown_internal_error
      description: >
        Errors:

        - \`error_exceed_max_image_size\`  - Input image size exceeds the
        maximum limit

        - \`exceed_max_filesize\` - Input file size exceeds the maximum limit

        - \`invalid_parameter\` - Invalid parameter value

        - \`error_download_image\` - Download source image error

        - \`error_download_mask\` - Download mask image error

        - \`error_decode_image\` - Decode source image error

        - \`error_decode_mask\` - Decode mask image error

        - \`error_nsfw_content_detected\` - NSFW content detected in source
        image

        - \`error_no_face\` - No face detected on source image

        - \`error_pose\` - Failed to detect pose on source image

        - \`error_face_parsing\` - Failed to do face segmentation on source
        image

        - \`error_inference\` - Inference pipeline error

        - \`exceed_nsfw_retry_limits\` - Exceed the retry limits to avoid
        generated NSFW image

        - \`error_upload\` - Upload result image error

        - \`unknown_internal_error\` - Others
  responses:
    InvalidApiKey:
      description: Invalid or missing API key
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 401
                description: Response status
              error:
                type: string
                example: Invalid API key
    TooManyRequests:
      description: Too many requests
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 429
                description: Response status
              error:
                type: string
                example: Too many requests
    InvalidTaskId:
      description: Invalid task ID
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 400
                description: Response status
              error:
                type: string
                example: Invalid task ID
    TaskTimeout:
      description: Task execution timeout
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 500
                description: Response status
              error:
                type: string
                example: Task execution timed out
