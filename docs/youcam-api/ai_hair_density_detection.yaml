openapi: 3.0.0
info:
  title: AI Hair Density Detection
  description: >
    # Overview

    AI Hair Density Detection delivers a fast, professional, photo‑based
    assessment that accurately classifies hair density into four levels by
    evaluating scalp visibility and hair distribution patterns, providing
    trichoscopy‑inspired insights without physical tools and empowering
    businesses to offer expert‑level personalization at scale from a single
    uploaded image.


    ![](https://bcw-media.s3.ap-northeast-1.amazonaws.com/strapi/assets/AI_hair_density_S3_02_b34f2db2ce.jpg)


    ## Integration Guide

    * How to Take Photos for AI Hair Density Detection

    * Take a selfie
      - Please face the camera directly with proper lighting, then lower your head to a 45‑degree angle. Keep your hair untied and ensure your entire hairline is clearly visible.

      ![](https://d3ss46vukfdtpo.cloudfront.net/static/media/img_popup_step_animated_02.aadf7a34.png)

      - Instead, use the JS Camera Kit to take a photo.

    * How to Detect Hair Density by AI

    * Using the ***/s2s/v2.0/file*** API, please upload the following assets:
      - Your selfie photo.

    * Execute AI task ***/s2s/v2.0/task/hair-density-detection*** </br>

    Run the detection task by sending one front facing 45 degree lower selfie
    image. Use it's file ID as the source input for the AI.


    * Polling to check the status of a task until it succeed or error</br>

    This ***task_id*** is used to monitor the task's status through polling GET
    'task/hair-density-detection' to retrieve the current engine status. Until
    the engine completes the task, the status will remain 'running', and no
    units will be consumed during this stage.



    ## Hair Density Classification


    |Thumbnail|Hair Density Classification|Description|

    | ----  | ----  | ----  |

    |![](https://d3ss46vukfdtpo.cloudfront.net/static/media/dt_classification_LV01.5097a6c2.png)|Level
    1<br>Extremely Low Density|Hair appears significantly sparse, with visible
    scalp across a large area. Hair fibers are thin and coverage is minimal.|

    |![](https://d3ss46vukfdtpo.cloudfront.net/static/media/dt_classification_LV02.7966983d.png)|Level
    2<br>Low Density|Noticeable thinning with clear scalp visibility, especially
    at the crown and part lines. Hair may lack volume and body.|

    |![](https://d3ss46vukfdtpo.cloudfront.net/static/media/dt_classification_LV03.c49dbfb7.png)|Level
    3<br>Medium Density|Scalp is partially visible under direct light, but hair
    still maintains moderate volume and coverage. Hair may feel finer but
    remains relatively healthy.|

    |![](https://d3ss46vukfdtpo.cloudfront.net/static/media/dt_classification_LV04.e467f2aa.png)|Level
    4<br>High Density|Hair looks full and thick, with minimal to no scalp
    visibility. Hair strands are closely packed, providing rich volume and
    natural coverage.|



    * Suggestions for How to Shoot


    ![Suggestions for How to
    Shoot](https://bcw-media.s3.ap-northeast-1.amazonaws.com/strapi/assets/icon_S2_step1_20d0a161da.png
    "Suggestions for How to Shoot")


    ![](https://bcw-media.s3.ap-northeast-1.amazonaws.com/strapi/assets/AI_hair_density_S1_02_f60369b14d.jpg)


    ## File Specs & Errors

    * Supported Formats & Dimensions


    |Type|Supported Dimensions|Supported File Size|Supported Formats|

    |  ----  | ----  | ----  | ----  |

    |AI Hair Density Detection|The image must be at least 100 pixels wide and
    tall, and no more than 4096 pixels in either dimension. If one side of your
    image is longer than 1080 pixels, it will be resized automatically to fit
    within that limit for analysis.|< 10MB|jpg/png|


    * Error Codes


    |Error Code|Description|

    |  ----  | ----  |

    |error_below_min_image_size|If your image is smaller than 100 pixels in
    width or height, it's too small to use|

    |error_face_position_invalid|Your face needs to be fully visible in the
    image, without any parts cut off|

    |error_face_position_too_small|The face in your photo is too small to
    analyze properly|

    |error_face_position_out_of_boundary|Your face is either too large or
    partially outside the edges of the photo|

    |error_insufficient_lighting|The lighting is too dim, which makes analysis
    difficult|

    |error_face_angle_invalid|Your face angle isn't quite right. For
    front-facing shots, keep your head within 10 degrees of straight. For
    side-facing shots, the angle should be more than 15 degrees|


    * Environment & Dependency


    | Sample Code Language / Tool | Recommended Runtime Versions |

    |---|---|

    | cURL | - bash >= 3.2</br>   - curl >= 7.58 (modern TLS/HTTP
    support)</br>   - jq >= 1.6 (robust JSON parsing) |

    | Node.js (JavaScript) | Node >= 18 (for global fetch) |

    | JavaScript | - Chrome / Edge >= 80</br>   - Firefox >= 74</br>   - Safari
    >= 13.1 |

    | PHP | PHP >= 7.4 (for modern TLS/compat), ext-curl (recommended) or
    allow_url_fopen=On + ext-openssl, ext-json |

    | Python | Python >= 3.10 (for f-strings), requests >= 2.20.0 |

    | Java | Java 11+ (for HttpClient), Jackson Databind >= 2.12.0 |


