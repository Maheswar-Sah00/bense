openapi: 3.0.0
info:
  title: AI Hair Length Detection
  description: >
    # Overview

    AI Hair Length Measurement offers haircare brands and salons a quick
    solution to analyze and measure hair length, enabling informed decisions for
    personalized products and services.

    Our AI is meticulously trained on a vast dataset of diverse images to ensure
    precise and reliable hair length detection. By analyzing thousands of images
    of various hair types and styles, it precisely identifies and categorizes
    five distinct hair lengths, from above-the-ear to mid-back, with exceptional
    accuracy.


    ![](https://bcw-media.s3.ap-northeast-1.amazonaws.com/hair_length_S1_01_enu_b03bd393af.jpg)


    ## Integration Guide

    * How to Take Photos for AI Hair Length Detection

    * Take a selfie facing forward
      - Just one clear shot, looking straight into the camera. Leave your hair down so it falls over your chest, and make sure you're staring directly ahead for that front-on view.
      - Instead, use the JS Camera Kit to take a photo. Just leave your hair down so it falls over your chest. Don't tie it up.

    * How to Detect Hair Length by AI

    * Using the ***/s2s/v2.0/file*** API, please upload the following assets:
      - Your selfie photo.

    * Execute AI task ***/s2s/v2.0/task/hair-length-detection*** </br>

    Run the hair-length detection task by sending one front facing selfie image.
    Use it's file ID as the source input for the AI.


    * Polling to check the status of a task until it succeed or error</br>

    This ***task_id*** is used to monitor the task's status through polling GET
    'task/hair-length-detection' to retrieve the current engine status. Until
    the engine completes the task, the status will remain 'running', and no
    units will be consumed during this stage.


    ## Hair Length Classification

    |Thumbnail|Hair Length Classification|Description|

    | ----  | ----  | ----  |

    |![](https://d3ss46vukfdtpo.cloudfront.net/static/media/thumb_hair_lenth_above_the_ears.b41525da.png)|Above-Ear
    Length|Hair that falls just above the ear, offering a sleek and stylish look
    that frames the face nicely.|

    |![](https://d3ss46vukfdtpo.cloudfront.net/static/media/thumb_hair_lenth_ear_length.0740b805.png)|Ear-Length|Hair
    that reaches the earlobe, providing a chic and versatile style that's easy
    to maintain.|

    |![](https://d3ss46vukfdtpo.cloudfront.net/static/media/thumb_hair_lenth_short_hair.d7f24ddb.png)|Short
    Hair|Hair that is cut above the shoulders, ideal for a fresh, modern look
    that’s both bold and low-maintenance.|

    |![](https://d3ss46vukfdtpo.cloudfront.net/static/media/thumb_hair_lenth_above_chest.1b624c17.png)|Medium-Length|Hair
    that falls around the collarbone, offering a balanced style that’s perfect
    for both updos and loose waves.|

    |![](https://d3ss46vukfdtpo.cloudfront.net/static/media/thumb_hair_lenth_longer_hair.7fbcc9d0.png)|Long
    Hair|Long hair that exudes elegance, providing a classic appearance with
    numerous styling options.|


    * Result Arguments

    * term: result is a string showing the detected hair length type. Here lists
    all the possible result strings in an array:
      ```json
      ["above the ears", "ear length", "ear length or longer", "short hair", "short hair or longer", "above chest", "above chest or longer", "long hair"]
      ```

    * Suggestions for How to Shoot

    ![Suggestions for How to
    Shoot](https://bcw-media.s3.ap-northeast-1.amazonaws.com/strapi/assets/AI%20Hair%20Length%20Detection_how%20to%20shoot.png
    "Suggestions for How to Shoot")


    ![](https://bcw-media.s3.ap-northeast-1.amazonaws.com/strapi/assets/AI%20Skin%20Analysis_camera.png)


    ## File Specs & Errors

    * Supported Formats & Dimensions


    |Type|Supported Dimensions|Supported File Size|Supported Formats|

    |  ----  | ----  | ----  | ----  |

    |AI Hair Length Detection|The image must be at least 320 pixels wide and
    tall, and no more than 4096 pixels in either dimension. If one side of your
    image is longer than 1080 pixels, it will be resized automatically to fit
    within that limit for analysis.|< 10MB|jpg/png|


    * Error Codes


    |Error Code|Description|

    |  ----  | ----  |

    |error_below_min_image_size|If your image is smaller than 320 pixels in
    width or height, it's too small to use|

    |error_face_position_invalid|Your face needs to be fully visible in the
    image, without any parts cut off|

    |error_face_position_too_small|The face in your photo is too small to
    analyze properly|

    |error_face_position_out_of_boundary|Your face is either too large or
    partially outside the edges of the photo|

    |error_insufficient_lighting|The lighting is too dim, which makes analysis
    difficult|

    |error_face_angle_invalid|Your face angle isn't quite right. For
    front-facing shots, keep your head within 10 degrees of straight. For
    side-facing shots, the angle should be more than 15 degrees|


    * Environment & Dependency


    | Sample Code Language / Tool | Recommended Runtime Versions |

    |---|---|

    | cURL | - bash >= 3.2</br>   - curl >= 7.58 (modern TLS/HTTP
    support)</br>   - jq >= 1.6 (robust JSON parsing) |

    | Node.js (JavaScript) | Node >= 18 (for global fetch) |

    | JavaScript | - Chrome / Edge >= 80</br>   - Firefox >= 74</br>   - Safari
    >= 13.1 |

    | PHP | PHP >= 7.4 (for modern TLS/compat), ext-curl (recommended) or
    allow_url_fopen=On + ext-openssl, ext-json |

    | Python | Python >= 3.10 (for f-strings), requests >= 2.20.0 |

    | Java | Java 11+ (for HttpClient), Jackson Databind >= 2.12.0 |


